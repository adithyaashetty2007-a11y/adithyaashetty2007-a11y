<svg xmlns="http://w3.org" viewBox="0 0 1000 220" width="100%" height="220">
  <defs>
    <!-- Cyberpunk Purple-to-Cyan Background Gradient -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231942" />
      <stop offset="40%" stop-color="#5e548e" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    
    <style>
      .title {
        font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: 3px;
      }
      .subtitle {
        font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        font-size: 16px;
        fill: #b5a6c9;
        letter-spacing: 1.5px;
      }
      /* Smooth keyframe translations for wave flow */
      @keyframes waveAnimation {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .wave-group {
        animation: waveAnimation 12s linear infinite;
      }
      .wave-reverse {
        animation: waveAnimation 8s linear infinite reverse;
      }
    </style>
  </defs>

  <!-- Static Canvas Base Layer -->
  <rect width="1000" height="220" fill="url(#cyberGradient)" rx="8" />

  <!-- Animated Layer 1: Cyan Wave Crests -->
  <g class="wave-group" opacity="0.25">
    <path d="M 0,150 Q 250,110 500,150 T 1000,150 T 1500,150 T 2000,150 L 2000,220 L 0,220 Z" fill="#00e5ff" />
  </g>
  
  <!-- Animated Layer 2: Deep Purple Undercurrent -->
  <g class="wave-reverse" opacity="0.35">
    <path d="M 0,165 Q 250,195 500,165 T 1000,165 T 1500,165 T 2000,165 L 2000,220 L 0,220 Z" fill="#8a2be2" />
  </g>

  <!-- Centered Typography Modules -->
  <text x="50%" y="95" text-anchor="middle" class="title">ADITHYA A SHETTY</text>
  <text x="50%" y="135" text-anchor="middle" class="subtitle">Software Engineer | Frontend Developer | Tech Innovator</text>
</svg>
