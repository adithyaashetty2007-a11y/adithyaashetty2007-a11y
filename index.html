<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Waves</title>
  <style>
    /* Reset margins and prevent scrollbars */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050510; /* Dark background to make neon pop */
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="neonCanvas"></canvas>

  <script>
    const canvas = document.getElementById('neonCanvas');
    const ctx = canvas.getContext('2d');

    // Handle canvas resizing to fill the window
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let time = 0;

    // Define multiple waves for a layered, fluid effect
    // yOffset is a percentage of the canvas height (e.g., 0.85 is near the bottom)
    const waves = [
      { amplitude: 40, frequency: 0.005, speed: 0.03, color: '#ff0055', yOffset: 0.85 },
      { amplitude: 30, frequency: 0.008, speed: 0.04, color: '#00d8ff', yOffset: 0.90 },
      { amplitude: 50, frequency: 0.004, speed: 0.02, color: '#bf00ff', yOffset: 0.80 }
    ];

    function animate() {
      // Clear the canvas on each frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      waves.forEach(wave => {
        ctx.beginPath();
        const baseHeight = canvas.height * wave.yOffset;

        // Draw the wave across the width of the canvas
        for (let x = 0; x < canvas.width; x++) {
          // Calculate the Y position using a sine wave
          const y = baseHeight + Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;
          
          if (x === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        // Apply neon styling
        ctx.strokeStyle = wave.color;
        ctx.lineWidth = 4;
        
        // The glow effect
        ctx.shadowBlur = 20;
        ctx.shadowColor = wave.color;

        ctx.stroke();
        
        // Reset shadow to prevent compounding glow on subsequent draws
        ctx.shadowBlur = 0; 
      });

      time += 1;
      requestAnimationFrame(animate);
    }

    // Start the animation loop
    animate();
  </script>

</body>
</html>
